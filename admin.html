<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Prevent Search Engine Indexing -->
    <meta name="robots" content="noindex, nofollow">
    
    <title>Admin Dashboard - Canon Trade Center</title>

    <!-- App Icons & Manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#CC0000">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loader Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #ef4444; /* Canon Red-ish */
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Mobile safe area spacing */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Hide scrollbar for clean mobile horizontal lists if needed */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#CC0000', // Canon Red
                            dark: '#1a1a1a',
                            gray: '#f5f5f5'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- LOGIN VIEW -->
    <div id="login-view" class="fixed inset-0 z-50 bg-slate-50 flex flex-col items-center justify-center p-6 transition-opacity duration-300">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 transform transition-all">
            <div class="flex justify-center mb-8">
                <img src="https://i.ibb.co/Kcv18dvK/Canon-Trade-Center-Logo-copy.png" alt="Canon Trade Center" class="h-12 object-contain">
            </div>
            
            <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">Admin Portal</h2>
            <p class="text-center text-slate-500 mb-8 text-sm">Sign in to manage your inventory</p>
            
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Email</label>
                    <div class="relative">
                        <i class="ph ph-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="email" id="email" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-red focus:border-transparent transition-all" placeholder="admin@canon.com" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-red focus:border-transparent transition-all" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-semibold py-3.5 rounded-xl shadow-lg hover:shadow-xl transform active:scale-95 transition-all flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <i class="ph ph-arrow-right font-bold"></i>
                </button>
            </form>
        </div>
        <p class="mt-8 text-xs text-slate-400">© 2024 Canon Trade Center</p>
    </div>

    <!-- DESKTOP SIDEBAR -->
    <aside id="desktop-sidebar" class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 h-full">
        <div class="p-6 border-b border-slate-100 flex items-center gap-3">
            <img src="https://i.ibb.co/Kcv18dvK/Canon-Trade-Center-Logo-copy.png" alt="Logo" class="h-8">
        </div>
        
        <nav class="flex-1 p-4 space-y-1">
            <button data-target="products-section" class="nav-btn w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition-colors text-slate-600 hover:bg-slate-50 hover:text-brand-red active-nav">
                <i class="ph ph-camera text-xl"></i> Products
            </button>
            <button data-target="categories-section" class="nav-btn w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition-colors text-slate-600 hover:bg-slate-50 hover:text-brand-red">
                <i class="ph ph-squares-four text-xl"></i> Categories
            </button>
            <button data-target="orders-section" class="nav-btn w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition-colors text-slate-600 hover:bg-slate-50 hover:text-brand-red">
                <i class="ph ph-receipt text-xl"></i> Orders
            </button>
        </nav>

        <div class="p-4 border-t border-slate-100">
            <button id="logout-btn-desktop" class="w-full flex items-center gap-2 px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                <i class="ph ph-sign-out text-lg"></i> Logout
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div id="main-content" class="flex-1 flex flex-col h-full overflow-hidden relative opacity-0 pointer-events-none transition-opacity duration-300">
        
        <!-- Mobile Header -->
        <header class="md:hidden h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 sticky top-0 z-20">
            <img src="https://i.ibb.co/Kcv18dvK/Canon-Trade-Center-Logo-copy.png" alt="Logo" class="h-8">
            <button id="logout-btn-mobile" class="p-2 text-slate-500 hover:text-red-600 rounded-full hover:bg-slate-100">
                <i class="ph ph-sign-out text-xl"></i>
            </button>
        </header>

        <!-- Dynamic Title Bar (Desktop) -->
        <div class="hidden md:flex h-16 bg-white border-b border-slate-200 items-center justify-between px-8">
            <h1 id="page-title" class="text-xl font-bold text-slate-800">Inventory</h1>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                <span class="text-xs font-medium text-slate-500">System Online</span>
            </div>
        </div>

        <!-- Scrollable Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
            
            <!-- PRODUCTS SECTION -->
            <section id="products-section" class="view-section space-y-6">
                <div class="flex justify-between items-center md:hidden">
                    <h2 class="text-lg font-bold text-slate-800">Products</h2>
                </div>
                
                <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                    <!-- Products injected here -->
                    <div class="col-span-full flex justify-center py-12">
                        <div class="loader border-slate-200 border-t-slate-800"></div>
                    </div>
                </div>
            </section>

            <!-- CATEGORIES SECTION -->
            <section id="categories-section" class="view-section hidden space-y-6">
                <div class="flex justify-between items-center md:hidden">
                    <h2 class="text-lg font-bold text-slate-800">Categories</h2>
                </div>
                <div id="categories-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Categories injected here -->
                </div>
            </section>

            <!-- ORDERS SECTION -->
            <section id="orders-section" class="view-section hidden space-y-6">
                <div class="flex justify-between items-center md:hidden">
                    <h2 class="text-lg font-bold text-slate-800">Orders</h2>
                </div>
                <div id="order-list" class="space-y-4">
                    <!-- Orders injected here -->
                </div>
            </section>

        </main>

        <!-- Floating Action Button (FAB) -->
        <button id="fab" class="absolute bottom-28 md:bottom-8 right-4 md:right-8 w-14 h-14 bg-brand-dark hover:bg-brand-red text-white rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition-all flex items-center justify-center z-30">
            <i class="ph ph-plus text-2xl font-bold"></i>
        </button>

        <!-- Mobile Bottom Nav -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 h-16 pb-safe z-40 grid grid-cols-3">
            <button data-target="products-section" class="nav-btn-mobile flex flex-col items-center justify-center gap-1 text-slate-400 active-mobile-nav">
                <i class="ph ph-camera text-2xl mb-0.5"></i>
                <span class="text-[10px] font-medium">Products</span>
            </button>
            <button data-target="categories-section" class="nav-btn-mobile flex flex-col items-center justify-center gap-1 text-slate-400">
                <i class="ph ph-squares-four text-2xl mb-0.5"></i>
                <span class="text-[10px] font-medium">Categories</span>
            </button>
            <button data-target="orders-section" class="nav-btn-mobile flex flex-col items-center justify-center gap-1 text-slate-400">
                <i class="ph ph-receipt text-2xl mb-0.5"></i>
                <span class="text-[10px] font-medium">Orders</span>
            </button>
        </nav>
    </div>

    <!-- MODALS -->
    
    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm hidden flex items-end md:items-center justify-center p-0 md:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full md:max-w-2xl h-[90vh] md:h-auto md:max-h-[85vh] rounded-t-2xl md:rounded-2xl shadow-2xl flex flex-col transform translate-y-full md:translate-y-0 transition-transform duration-300">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="product-modal-title" class="font-bold text-lg">Product Details</h3>
                <button class="close-modal w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <form id="product-form" class="space-y-4">
                    <input type="hidden" name="id">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="col-span-1 md:col-span-2">
                            <label class="text-xs font-bold text-slate-500 uppercase">Product Name</label>
                            <input type="text" name="name" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none" placeholder="Canon EOS R5" required>
                        </div>
                        
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">Price (LKR)</label>
                            <input type="number" name="price" step="0.01" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none" placeholder="0.00" required>
                        </div>
                        
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase">Condition</label>
                            <select name="condition" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none">
                                <option value="new">Brand New</option>
                                <option value="used">Used / Pre-owned</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase">Description</label>
                        <textarea name="description" rows="3" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none" placeholder="Product features..."></textarea>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase">Category</label>
                        <div class="relative">
                            <select name="subcategory_id" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-800 focus:outline-none appearance-none" required>
                                <!-- Options populated by JS -->
                            </select>
                            <i class="ph ph-caret-down absolute right-3 top-1/2 pt-1 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Enhanced Image Picker -->
                    <div class="image-uploader" data-target-input="thumbnail_url">
                        <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Product Image</label>
                        
                        <!-- Preview Area -->
                        <div class="relative w-full h-48 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl mb-3 flex items-center justify-center overflow-hidden group bg-black/5">
                            <img src="" class="preview-img w-full h-full object-cover hidden">
                            
                            <!-- Video Feed for Camera -->
                            <video class="camera-feed w-full h-full object-cover hidden" autoplay playsinline muted></video>
                            <canvas class="camera-canvas hidden"></canvas>

                            <div class="placeholder text-slate-400 flex flex-col items-center gap-2">
                                <i class="ph ph-image text-3xl"></i>
                                <span class="text-xs">No image selected</span>
                            </div>
                            
                            <!-- Overlay Loading -->
                            <div class="loading-overlay absolute inset-0 bg-white/80 flex items-center justify-center hidden z-20">
                                <div class="loader border-slate-200 border-t-slate-800"></div>
                            </div>
                            
                            <!-- Capture Button (Only shows when camera is active) -->
                            <button type="button" class="btn-capture absolute bottom-4 left-1/2 -translate-x-1/2 bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-full shadow-lg font-bold hidden z-10 flex items-center gap-2">
                                <i class="ph ph-aperture text-lg"></i> Capture
                            </button>
                        </div>

                        <!-- Hidden Input for Form Submission -->
                        <input type="hidden" name="thumbnail_url" class="final-url-input">

                        <!-- Actions -->
                        <div class="grid grid-cols-3 gap-2">
                            <!-- Link Option -->
                            <button type="button" class="btn-link-mode flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-xs font-medium text-slate-600 transition-colors border border-slate-200">
                                <i class="ph ph-link text-lg"></i> Link
                            </button>
                            
                            <!-- Upload Option -->
                            <button type="button" class="btn-upload-mode flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-xs font-medium text-slate-600 transition-colors border border-slate-200 relative overflow-hidden">
                                <i class="ph ph-upload-simple text-lg"></i> Upload
                                <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer file-upload-input z-10">
                            </button>
                            
                            <!-- Camera Option (API based) -->
                            <button type="button" class="btn-camera-mode flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-xs font-medium text-slate-600 transition-colors border border-slate-200 relative">
                                <i class="ph ph-camera text-lg"></i> Camera
                            </button>
                        </div>

                        <!-- Link Input (Hidden by default) -->
                        <div class="link-input-container mt-2 hidden animate-fade-in">
                            <div class="flex gap-2">
                                <input type="url" class="w-full p-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-800" placeholder="Paste image URL here...">
                                <button type="button" class="btn-confirm-link px-3 bg-slate-800 text-white rounded-lg text-xs font-bold">OK</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50 rounded-b-2xl">
                <button type="button" class="close-modal px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition-colors">Cancel</button>
                <button type="button" onclick="document.getElementById('product-form').dispatchEvent(new Event('submit'))" class="px-5 py-2.5 text-sm font-bold text-white bg-slate-900 hover:bg-black rounded-lg shadow-lg hover:shadow-xl transition-all">Save Product</button>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-lg">New Category</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i class="ph ph-x text-xl"></i></button>
            </div>
            <form id="category-form" class="p-6 space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Category Name</label>
                    <input type="text" name="name" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-800 outline-none" required>
                </div>
                
                <!-- Category Image Picker -->
                <div class="image-uploader" data-target-input="image_url">
                    <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Category Image</label>
                    
                    <div class="relative w-full h-32 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl mb-3 flex items-center justify-center overflow-hidden group bg-black/5">
                        <img src="" class="preview-img w-full h-full object-cover hidden">
                        
                        <!-- Video Feed -->
                        <video class="camera-feed w-full h-full object-cover hidden" autoplay playsinline muted></video>
                        <canvas class="camera-canvas hidden"></canvas>

                        <div class="placeholder text-slate-400 flex flex-col items-center gap-2">
                            <i class="ph ph-image text-2xl"></i>
                            <span class="text-[10px]">No image</span>
                        </div>
                        
                        <div class="loading-overlay absolute inset-0 bg-white/80 flex items-center justify-center hidden z-20">
                            <div class="loader w-6 h-6 border-slate-200 border-t-slate-800"></div>
                        </div>

                         <!-- Capture Button -->
                         <button type="button" class="btn-capture absolute bottom-3 left-1/2 -translate-x-1/2 bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-full shadow-lg text-xs font-bold hidden z-10 flex items-center gap-1">
                            <i class="ph ph-aperture"></i> Capture
                        </button>
                    </div>

                    <input type="hidden" name="image_url" class="final-url-input">

                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="btn-link-mode flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-[10px] font-medium text-slate-600 border border-slate-200">
                            <i class="ph ph-link text-lg"></i> Link
                        </button>
                        <button type="button" class="btn-upload-mode flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-[10px] font-medium text-slate-600 border border-slate-200 relative">
                            <i class="ph ph-upload-simple text-lg"></i> Upload
                            <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer file-upload-input z-10">
                        </button>
                        <button type="button" class="btn-camera-mode flex flex-col items-center gap-1 p-2 bg-slate-50 hover:bg-slate-100 rounded-lg text-[10px] font-medium text-slate-600 border border-slate-200 relative">
                            <i class="ph ph-camera text-lg"></i> Camera
                        </button>
                    </div>

                    <div class="link-input-container mt-2 hidden">
                        <div class="flex gap-2">
                            <input type="url" class="w-full p-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" placeholder="https://...">
                            <button type="button" class="btn-confirm-link px-2 bg-slate-800 text-white rounded-lg text-xs">OK</button>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-black transition-all">Create Category</button>
            </form>
        </div>
    </div>

    <!-- Subcategory Modal -->
    <div id="subcategory-modal" class="fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-lg">New Subcategory</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i class="ph ph-x text-xl"></i></button>
            </div>
            <form id="subcategory-form" class="p-6 space-y-4">
                <input type="hidden" name="category_id">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Subcategory Name</label>
                    <input type="text" name="name" class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-800 outline-none" required>
                </div>
                <button type="submit" class="w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-black transition-all">Add Subcategory</button>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="fixed inset-0 z-[70] bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl shadow-2xl p-6 text-center">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="ph ph-trash text-2xl"></i>
            </div>
            <h3 class="font-bold text-lg text-slate-800 mb-2">Delete Item?</h3>
            <p class="text-sm text-slate-500 mb-6">This action cannot be undone.</p>
            <div class="flex gap-3">
                <button class="close-modal flex-1 py-2.5 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 transition-colors">Cancel</button>
                <button id="confirm-delete-btn" class="flex-1 py-2.5 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 shadow-lg shadow-red-200 transition-all">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 md:translate-x-0 md:left-auto md:bottom-8 md:right-8 z-[80] flex flex-col gap-2 w-max max-w-[90vw]"></div>

    <script>
        class AdminApp {
            constructor() {
                // Initialize Supabase
                const SUPABASE_URL = 'https://ysigixfsunoovyaoasdh.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzaWdpeGZzdW5vb3Z5YW9hc2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzNjc5NzIsImV4cCI6MjA4NTk0Mzk3Mn0.U5_aWaUTIlqwyKTlJcSMl-YHjD5KDbA_kUnoEaB3A4Y';
                this.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // State
                this.products = [];
                this.categories = [];
                this.orders = [];
                this.currentSection = 'products-section';
                this.activeStreams = []; // Track camera streams to stop them

                this.init();
            }

            async init() {
                this.setupListeners();
                
                // Check Session
                if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                    this.showDashboard();
                    await this.fetchData();
                } else {
                    document.getElementById('login-view').classList.remove('hidden');
                }
            }

            setupListeners() {
                // Login
                document.getElementById('login-form').addEventListener('submit', (e) => this.handleLogin(e));
                
                // Logout
                const logoutHandler = () => {
                    sessionStorage.removeItem('isAdminLoggedIn');
                    window.location.reload();
                };
                document.getElementById('logout-btn-desktop').addEventListener('click', logoutHandler);
                document.getElementById('logout-btn-mobile').addEventListener('click', logoutHandler);

                // Navigation
                const navHandler = (target) => {
                    this.currentSection = target;
                    this.updateUI();
                };

                document.querySelectorAll('.nav-btn, .nav-btn-mobile').forEach(btn => {
                    btn.addEventListener('click', () => navHandler(btn.dataset.target));
                });

                // FAB
                document.getElementById('fab').addEventListener('click', () => {
                    if (this.currentSection === 'products-section') this.openModal('product-modal');
                    if (this.currentSection === 'categories-section') this.openModal('category-modal');
                });

                // Modals
                document.querySelectorAll('.close-modal').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const modal = e.target.closest('[id$="-modal"]');
                        this.closeModal(modal.id);
                    });
                });

                // Forms
                document.getElementById('product-form').addEventListener('submit', (e) => this.saveProduct(e));
                document.getElementById('category-form').addEventListener('submit', (e) => this.saveCategory(e));
                document.getElementById('subcategory-form').addEventListener('submit', (e) => this.saveSubcategory(e));

                // Image Uploaders
                this.setupImageUploaders();
            }

            setupImageUploaders() {
                document.querySelectorAll('.image-uploader').forEach(container => {
                    const linkBtn = container.querySelector('.btn-link-mode');
                    const linkContainer = container.querySelector('.link-input-container');
                    const linkInput = linkContainer.querySelector('input');
                    const linkConfirm = linkContainer.querySelector('.btn-confirm-link');
                    
                    const fileInputs = container.querySelectorAll('.file-upload-input');
                    const cameraBtn = container.querySelector('.btn-camera-mode');
                    const captureBtn = container.querySelector('.btn-capture');
                    const videoEl = container.querySelector('.camera-feed');
                    const canvasEl = container.querySelector('.camera-canvas');
                    
                    const hiddenInput = container.querySelector('.final-url-input');
                    const previewImg = container.querySelector('.preview-img');
                    const placeholder = container.querySelector('.placeholder');
                    const loader = container.querySelector('.loading-overlay');

                    // 1. Link Mode
                    linkBtn.addEventListener('click', () => {
                        linkContainer.classList.toggle('hidden');
                        if (!linkContainer.classList.contains('hidden')) linkInput.focus();
                        this.stopCamera(videoEl, captureBtn);
                    });

                    const setLink = () => {
                        const url = linkInput.value;
                        if (url) {
                            hiddenInput.value = url;
                            previewImg.src = url;
                            previewImg.classList.remove('hidden');
                            placeholder.classList.add('hidden');
                            linkContainer.classList.add('hidden');
                            this.stopCamera(videoEl, captureBtn);
                        }
                    };
                    linkConfirm.addEventListener('click', setLink);

                    // 2. File Upload
                    fileInputs.forEach(input => {
                        input.addEventListener('change', async (e) => {
                            this.stopCamera(videoEl, captureBtn);
                            const file = e.target.files[0];
                            if (!file) return;
                            await this.uploadFile(file, loader, hiddenInput, previewImg, placeholder);
                            input.value = '';
                        });
                    });

                    // 3. Camera Mode (Real getUserMedia)
                    cameraBtn.addEventListener('click', async () => {
                        // Reset other views
                        linkContainer.classList.add('hidden');
                        previewImg.classList.add('hidden');
                        placeholder.classList.add('hidden');

                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            this.showToast('Camera API not supported', 'error');
                            placeholder.classList.remove('hidden');
                            return;
                        }

                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({ 
                                video: { facingMode: 'environment' } 
                            });
                            
                            videoEl.srcObject = stream;
                            videoEl.classList.remove('hidden');
                            captureBtn.classList.remove('hidden');
                            this.activeStreams.push(stream);

                        } catch (err) {
                            console.error(err);
                            this.showToast('No webcam detected', 'error');
                            placeholder.classList.remove('hidden');
                        }
                    });

                    // 4. Capture Photo
                    captureBtn.addEventListener('click', async () => {
                        // Draw video frame to canvas
                        canvasEl.width = videoEl.videoWidth;
                        canvasEl.height = videoEl.videoHeight;
                        const ctx = canvasEl.getContext('2d');
                        ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
                        
                        // Convert to blob
                        canvasEl.toBlob(async (blob) => {
                            if (blob) {
                                // Create a file object from blob
                                const file = new File([blob], `capture_${Date.now()}.jpg`, { type: 'image/jpeg' });
                                await this.uploadFile(file, loader, hiddenInput, previewImg, placeholder);
                                this.stopCamera(videoEl, captureBtn);
                            }
                        }, 'image/jpeg', 0.8);
                    });
                });
            }

            stopCamera(videoEl, captureBtn) {
                if (videoEl && videoEl.srcObject) {
                    const tracks = videoEl.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    videoEl.srcObject = null;
                }
                if (videoEl) videoEl.classList.add('hidden');
                if (captureBtn) captureBtn.classList.add('hidden');
            }

            stopAllCameras() {
                this.activeStreams.forEach(stream => {
                    stream.getTracks().forEach(track => track.stop());
                });
                this.activeStreams = [];
                document.querySelectorAll('.camera-feed').forEach(v => v.classList.add('hidden'));
                document.querySelectorAll('.btn-capture').forEach(b => b.classList.add('hidden'));
            }

            async uploadFile(file, loader, hiddenInput, previewImg, placeholder) {
                loader.classList.remove('hidden');
                try {
                    const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                    const { data, error } = await this.supabase.storage
                        .from('images')
                        .upload(fileName, file);

                    if (error) throw error;

                    const { data: { publicUrl } } = this.supabase.storage
                        .from('images')
                        .getPublicUrl(fileName);

                    hiddenInput.value = publicUrl;
                    previewImg.src = publicUrl;
                    previewImg.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    this.showToast('Image Uploaded', 'success');
                } catch (err) {
                    console.error(err);
                    this.showToast('Upload Failed: ' + err.message, 'error');
                    placeholder.classList.remove('hidden');
                } finally {
                    loader.classList.add('hidden');
                }
            }

            resetImageUploader(formId, imageUrl) {
                const container = document.querySelector(`#${formId} .image-uploader`);
                const previewImg = container.querySelector('.preview-img');
                const placeholder = container.querySelector('.placeholder');
                const hiddenInput = container.querySelector('.final-url-input');
                const linkInput = container.querySelector('.link-input-container input');
                
                // Force stop any camera running in this form
                const videoEl = container.querySelector('.camera-feed');
                const captureBtn = container.querySelector('.btn-capture');
                this.stopCamera(videoEl, captureBtn);

                if (imageUrl) {
                    hiddenInput.value = imageUrl;
                    previewImg.src = imageUrl;
                    previewImg.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                } else {
                    hiddenInput.value = '';
                    previewImg.src = '';
                    previewImg.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                }
                linkInput.value = '';
                container.querySelector('.link-input-container').classList.add('hidden');
            }

            // --- AUTH ---
            async handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const btn = e.target.querySelector('button');
                
                // Loading state
                const originalText = btn.innerHTML;
                btn.innerHTML = '<div class="loader w-5 h-5 border-white border-t-transparent"></div>';
                
                const { data, error } = await this.supabase
                    .from('admins')
                    .select('password')
                    .eq('email', email)
                    .single();

                if (!error && data && data.password === password) {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    this.showDashboard();
                    this.fetchData();
                } else {
                    this.showToast('Invalid credentials', 'error');
                }
                btn.innerHTML = originalText;
            }

            showDashboard() {
                const loginView = document.getElementById('login-view');
                const mainContent = document.getElementById('main-content');
                
                loginView.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loginView.classList.add('hidden'), 300);

                mainContent.classList.remove('hidden');
                // Trigger reflow
                void mainContent.offsetWidth; 
                mainContent.classList.remove('opacity-0', 'pointer-events-none');
            }

            // --- DATA ---
            async fetchData() {
                try {
                    const [productsRes, categoriesRes, ordersRes] = await Promise.all([
                        this.supabase.from('products_with_details').select('*').order('created_at', { ascending: false }),
                        this.supabase.from('categories').select('*, subcategories(*)').order('name'),
                        this.supabase.from('orders').select('*, order_items(*)').order('created_at', { ascending: false })
                    ]);

                    if (productsRes.error) throw productsRes.error;

                    this.products = productsRes.data;
                    this.categories = categoriesRes.data;
                    this.orders = ordersRes.data;

                    this.renderAll();
                    this.showToast('Inventory Synced', 'success');

                } catch (err) {
                    console.error(err);
                    this.showToast('Sync Failed', 'error');
                }
            }

            // --- RENDERING ---
            renderAll() {
                this.renderProducts();
                this.renderCategories();
                this.renderOrders();
                this.populateSubcategorySelect();
            }

            renderProducts() {
                const container = document.getElementById('product-list');
                if (this.products.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">No products found. Tap + to add one.</div>`;
                    return;
                }

                container.innerHTML = this.products.map(p => `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition-shadow relative group">
                        <div class="flex gap-4">
                            <div class="w-20 h-20 rounded-xl bg-slate-50 flex-shrink-0 overflow-hidden border border-slate-100">
                                <img src="${p.thumbnail_url || 'https://placehold.co/100x100?text=No+Img'}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100?text=Error'">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-slate-800 truncate pr-4">${p.name}</h3>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full ${p.condition === 'new' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'} font-bold uppercase tracking-wide">${p.condition}</span>
                                </div>
                                <p class="text-xs text-slate-500 mt-0.5 truncate">${p.category_name} &bull; ${p.subcategory_name}</p>
                                <div class="mt-2 flex items-baseline gap-1">
                                    <span class="text-xs text-slate-400">LKR</span>
                                    <span class="text-lg font-bold text-slate-900">${parseFloat(p.price).toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-50 flex justify-end gap-2">
                            <button onclick="app.editProduct(${p.id})" class="text-sm px-3 py-1.5 rounded-lg bg-slate-50 text-slate-600 font-medium hover:bg-slate-100 transition-colors">Edit</button>
                            <button onclick="app.confirmDelete('product', ${p.id})" class="text-sm px-3 py-1.5 rounded-lg bg-red-50 text-red-600 font-medium hover:bg-red-100 transition-colors">Delete</button>
                        </div>
                    </div>
                `).join('');
            }

            renderCategories() {
                const container = document.getElementById('categories-list');
                container.innerHTML = this.categories.map(c => `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                                    ${c.image_url ? `<img src="${c.image_url}" class="w-full h-full rounded-full object-cover">` : '<i class="ph ph-tag text-xl"></i>'}
                                </div>
                                <h3 class="font-bold text-slate-800">${c.name}</h3>
                            </div>
                            <button onclick="app.openSubcategoryModal(${c.id})" class="text-xs font-bold text-brand-red hover:bg-red-50 px-2 py-1 rounded">
                                + SUB
                            </button>
                        </div>
                        <div class="space-y-1 pl-13">
                            ${c.subcategories && c.subcategories.length > 0 
                                ? c.subcategories.map(s => `
                                    <div class="flex items-center gap-2 text-sm text-slate-500 py-1 border-l-2 border-slate-100 pl-3">
                                        <span>${s.name}</span>
                                    </div>
                                `).join('') 
                                : '<span class="text-xs text-slate-400 italic pl-3">No subcategories</span>'}
                        </div>
                    </div>
                `).join('');
            }

            renderOrders() {
                const container = document.getElementById('order-list');
                container.innerHTML = this.orders.map(o => `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex flex-col gap-3">
                        <div class="flex justify-between items-center pb-2 border-b border-slate-50">
                            <div>
                                <p class="font-bold text-slate-800">${o.customer_name}</p>
                                <p class="text-xs text-slate-500">${new Date(o.created_at).toLocaleDateString()}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-bold text-slate-900">LKR ${parseFloat(o.total_price).toLocaleString()}</p>
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium uppercase">${o.payment_method}</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <a href="tel:${o.customer_phone}" class="flex items-center gap-2 text-slate-600 hover:text-blue-600">
                                <i class="ph ph-phone"></i> ${o.customer_phone}
                            </a>
                            <button onclick="alert('Items: ' + ${o.order_items.length})" class="text-xs font-bold text-slate-400 hover:text-slate-600">
                                View Items <i class="ph ph-caret-right"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            populateSubcategorySelect() {
                const select = document.querySelector('[name="subcategory_id"]');
                select.innerHTML = '<option value="" disabled selected>Select Category</option>' + this.categories.map(c => `
                    <optgroup label="${c.name}">
                        ${c.subcategories.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                    </optgroup>
                `).join('');
            }

            // --- ACTIONS ---
            updateUI() {
                // Update Sections
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(this.currentSection).classList.remove('hidden');

                // Update Desktop Nav
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const isActive = btn.dataset.target === this.currentSection;
                    btn.classList.toggle('bg-slate-50', isActive);
                    btn.classList.toggle('text-brand-red', isActive);
                    btn.classList.toggle('text-slate-600', !isActive);
                });

                // Update Mobile Nav
                document.querySelectorAll('.nav-btn-mobile').forEach(btn => {
                    const isActive = btn.dataset.target === this.currentSection;
                    btn.classList.toggle('text-brand-red', isActive);
                    btn.classList.toggle('text-slate-400', !isActive);
                });
                
                // Update Title
                const titles = {'products-section': 'Inventory', 'categories-section': 'Categories', 'orders-section': 'Sales Orders'};
                document.getElementById('page-title').textContent = titles[this.currentSection];

                // FAB visibility
                const fab = document.getElementById('fab');
                if (this.currentSection === 'orders-section') fab.classList.add('scale-0');
                else fab.classList.remove('scale-0');
            }

            // --- PRODUCT LOGIC ---
            editProduct(id) {
                const p = this.products.find(x => x.id === id);
                if (!p) return;
                
                const form = document.getElementById('product-form');
                form.id.value = p.id;
                form.name.value = p.name;
                form.price.value = p.price;
                form.condition.value = p.condition;
                form.description.value = p.description || '';
                form.subcategory_id.value = p.subcategory_id;
                
                // Use helper to reset image UI
                this.resetImageUploader('product-form', p.thumbnail_url);

                document.getElementById('product-modal-title').textContent = 'Edit Product';
                this.openModal('product-modal');
            }

            async saveProduct(e) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                const id = formData.get('id');
                const btn = form.closest('.fixed').querySelector('button[onclick*="submit"]'); // Find save button
                const originalText = btn.textContent;
                btn.textContent = 'Saving...';

                const data = {
                    name: formData.get('name'),
                    price: parseFloat(formData.get('price')),
                    condition: formData.get('condition'),
                    description: formData.get('description'),
                    subcategory_id: parseInt(formData.get('subcategory_id'))
                };

                let res;
                if (id) {
                    res = await this.supabase.from('products').update(data).eq('id', id);
                } else {
                    res = await this.supabase.from('products').insert(data).select().single();
                }

                if (res.error) {
                    this.showToast(res.error.message, 'error');
                } else {
                    // Handle Image
                    const newId = id || res.data.id;
                    const imgUrl = formData.get('thumbnail_url');
                    
                    // Cleanup old thumbnails
                    await this.supabase.from('product_images').delete().match({ product_id: newId, is_thumbnail: true });
                    
                    if (imgUrl) {
                        await this.supabase.from('product_images').insert({
                            product_id: newId,
                            image_url: imgUrl,
                            is_thumbnail: true
                        });
                    }

                    this.showToast('Product Saved', 'success');
                    this.closeModal('product-modal');
                    this.fetchData();
                    
                    // Reset
                    form.reset();
                    form.id.value = '';
                    this.resetImageUploader('product-form', '');
                    document.getElementById('product-modal-title').textContent = 'Add Product';
                }
                btn.textContent = originalText;
            }

            async saveCategory(e) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                
                const { error } = await this.supabase.from('categories').insert({
                    name: formData.get('name'),
                    image_url: formData.get('image_url')
                });
                
                if (error) this.showToast(error.message, 'error');
                else {
                    this.showToast('Category Created', 'success');
                    this.closeModal('category-modal');
                    form.reset();
                    this.resetImageUploader('category-form', '');
                    this.fetchData();
                }
            }

            openSubcategoryModal(catId) {
                const form = document.getElementById('subcategory-form');
                form.category_id.value = catId;
                this.openModal('subcategory-modal');
            }

            async saveSubcategory(e) {
                e.preventDefault();
                const form = e.target;
                const { error } = await this.supabase.from('subcategories').insert({
                    name: form.name.value,
                    category_id: form.category_id.value
                });

                if (error) this.showToast(error.message, 'error');
                else {
                    this.showToast('Subcategory Added', 'success');
                    this.closeModal('subcategory-modal');
                    form.reset();
                    this.fetchData();
                }
            }

            confirmDelete(type, id) {
                this.openModal('delete-modal');
                const btn = document.getElementById('confirm-delete-btn');
                btn.onclick = async () => {
                    btn.textContent = 'Deleting...';
                    let table = type === 'product' ? 'products' : 'categories'; // simple logic
                    const { error } = await this.supabase.from(table).delete().eq('id', id);
                    
                    if (error) this.showToast('Delete failed', 'error');
                    else {
                        this.showToast('Item Deleted', 'success');
                        this.fetchData();
                    }
                    this.closeModal('delete-modal');
                    btn.textContent = 'Delete';
                };
            }

            // --- UI HELPERS ---
            openModal(id) {
                const modal = document.getElementById(id);
                // Reset form on open if it's an "Add" action
                if (id === 'product-modal' && !document.querySelector('#product-form [name="id"]').value) {
                    this.resetImageUploader('product-form', '');
                }
                if (id === 'category-modal') {
                    // Check if it's a fresh open (optional, simpler to just reset if no ID logic implemented for categories yet)
                    // this.resetImageUploader('category-form', '');
                }

                modal.classList.remove('hidden');
                // reflow
                void modal.offsetWidth;
                modal.classList.remove('opacity-0');
                
                const content = modal.querySelector('div');
                content.classList.remove('translate-y-full', 'scale-95');
            }

            closeModal(id) {
                const modal = document.getElementById(id);
                modal.classList.add('opacity-0');
                const content = modal.querySelector('div');
                content.classList.add('translate-y-full', 'scale-95');
                
                // Cleanup cameras if any open in this modal
                this.stopAllCameras();

                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }

            showToast(msg, type = 'neutral') {
                const container = document.getElementById('toast-container');
                const el = document.createElement('div');
                
                let icon = type === 'success' ? 'check-circle' : type === 'error' ? 'warning-circle' : 'info';
                let colors = type === 'success' ? 'bg-slate-900 text-white' : type === 'error' ? 'bg-red-500 text-white' : 'bg-white text-slate-800 border border-slate-200';

                el.className = `${colors} px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-medium transform translate-y-10 opacity-0 transition-all duration-300`;
                el.innerHTML = `<i class="ph ph-${icon} text-lg"></i> ${msg}`;
                
                container.appendChild(el);
                
                // Animate in
                requestAnimationFrame(() => {
                    el.classList.remove('translate-y-10', 'opacity-0');
                });

                // Remove
                setTimeout(() => {
                    el.classList.add('opacity-0', 'translate-y-4');
                    setTimeout(() => el.remove(), 300);
                }, 3000);
            }
        }

        const app = new AdminApp();
    </script>
</body>
</html>
