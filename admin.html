<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Canon Admin">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#CC0000">
    <meta name="robots" content="noindex, nofollow">

    <!-- App Icons (Updated) -->
    <link rel="apple-touch-icon" href="https://i.ibb.co/KzKwbFBS/favicon-96x96.png">
    <link rel="icon" type="image/png" href="https://i.ibb.co/KzKwbFBS/favicon-96x96.png">

    <!-- Embedded Manifest for PWA (Data URI with New Icon) -->
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Canon%20Trade%20Center%22%2C%22short_name%22%3A%22Canon%20Admin%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23CC0000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fi.ibb.co%2FKzKwbFBS%2Ffavicon-96x96.png%22%2C%22sizes%22%3A%2296x96%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D'>
    
    <title>Canon Admin</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        /* Smooth Scrolling & Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #CC0000;
            width: 24px; height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Utilities */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px; width: 20px;
            border-radius: 50%;
            background: #CC0000;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
        }
        
        /* Transition for accordion */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 500px; /* Arbitrary large height */
            opacity: 1;
        }
        .rotate-icon {
            transition: transform 0.3s ease;
        }
        .rotate-icon.open {
            transform: rotate(180deg);
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#CC0000',
                            dark: '#1a1a1a',
                            gray: '#f5f5f5'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- LOGIN VIEW -->
    <div id="login-view" class="fixed inset-0 z-[100] bg-slate-50 flex flex-col items-center justify-center p-6 transition-opacity duration-300">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8 transform transition-all">
            <div class="flex justify-center mb-8">
                <img src="https://i.ibb.co/Kcv18dvK/Canon-Trade-Center-Logo-copy.png" alt="Canon" class="h-12 object-contain">
            </div>
            <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">Admin Portal</h2>
            <p class="text-center text-slate-500 mb-8 text-sm">Sign in to manage inventory</p>
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Email</label>
                    <div class="relative">
                        <i class="ph ph-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="email" id="email" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-brand-red focus:border-transparent transition-all font-medium" placeholder="admin@canon.com" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                        <input type="password" id="password" class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-brand-red focus:border-transparent transition-all font-medium" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-brand-dark hover:bg-black text-white font-bold py-4 rounded-2xl shadow-lg hover:shadow-xl transform active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4">
                    <span>Sign In</span>
                    <i class="ph ph-arrow-right font-bold"></i>
                </button>
            </form>
        </div>
        <p class="mt-8 text-xs text-slate-400 font-medium">© 2025 Canon Trade Center</p>
    </div>

    <!-- DESKTOP SIDEBAR -->
    <aside id="desktop-sidebar" class="hidden md:flex flex-col w-72 bg-white border-r border-slate-200 h-full shadow-sm z-20">
        <div class="p-8 border-b border-slate-100 flex justify-center">
            <img src="https://i.ibb.co/Kcv18dvK/Canon-Trade-Center-Logo-copy.png" alt="Logo" class="h-8">
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button data-target="products-section" class="nav-btn w-full flex items-center gap-3 px-5 py-3.5 text-sm font-semibold rounded-2xl transition-all text-slate-600 hover:bg-slate-50 hover:text-brand-red">
                <i class="ph ph-camera text-xl"></i> Products
            </button>
            <button data-target="categories-section" class="nav-btn w-full flex items-center gap-3 px-5 py-3.5 text-sm font-semibold rounded-2xl transition-all text-slate-600 hover:bg-slate-50 hover:text-brand-red">
                <i class="ph ph-squares-four text-xl"></i> Categories
            </button>
            <button data-target="orders-section" class="nav-btn w-full flex items-center gap-3 px-5 py-3.5 text-sm font-semibold rounded-2xl transition-all text-slate-600 hover:bg-slate-50 hover:text-brand-red">
                <i class="ph ph-receipt text-xl"></i> Orders
            </button>
        </nav>
        <div class="p-6 border-t border-slate-100">
            <button id="logout-btn-desktop" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-sm font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-xl transition-colors">
                <i class="ph ph-sign-out text-lg"></i> Logout
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div id="main-content" class="flex-1 flex flex-col h-full overflow-hidden relative opacity-0 pointer-events-none transition-opacity duration-300">
        
        <!-- Mobile Header (App-like) -->
        <header class="md:hidden h-14 bg-white/90 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 sticky top-0 z-20 pt-safe">
            <img src="https://i.ibb.co/Kcv18dvK/Canon-Trade-Center-Logo-copy.png" alt="Logo" class="h-6">
            <button id="logout-btn-mobile" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-red-600 rounded-full active:bg-slate-100 transition-colors">
                <i class="ph ph-sign-out text-xl"></i>
            </button>
        </header>

        <!-- Desktop Header -->
        <div class="hidden md:flex h-20 bg-white border-b border-slate-200 items-center justify-between px-10">
            <h1 id="page-title" class="text-2xl font-bold text-slate-800 tracking-tight">Inventory</h1>
            <div class="flex items-center gap-2 bg-green-50 px-3 py-1.5 rounded-full border border-green-100">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-xs font-bold text-green-700 uppercase tracking-wider">Online</span>
            </div>
        </div>

        <!-- Scrollable Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-10 pb-32 md:pb-10 scroll-smooth">
            
            <!-- PRODUCTS SECTION -->
            <section id="products-section" class="view-section space-y-6">
                <div class="flex justify-between items-center md:hidden pb-2">
                    <h2 class="text-xl font-bold text-slate-800">Products</h2>
                </div>
                <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                    <!-- Products injected here -->
                    <div class="col-span-full flex justify-center py-20">
                        <div class="loader border-slate-200 border-t-slate-800"></div>
                    </div>
                </div>
            </section>

            <!-- CATEGORIES SECTION -->
            <section id="categories-section" class="view-section hidden space-y-6">
                <div class="flex justify-between items-center md:hidden pb-2">
                    <h2 class="text-xl font-bold text-slate-800">Categories</h2>
                </div>
                <!-- Categories List -->
                <div id="categories-list" class="space-y-4 max-w-4xl">
                    <!-- Categories injected here -->
                </div>
            </section>

            <!-- ORDERS SECTION -->
            <section id="orders-section" class="view-section hidden space-y-6">
                <div class="flex justify-between items-center md:hidden pb-2">
                    <h2 class="text-xl font-bold text-slate-800">Orders</h2>
                </div>
                <div id="order-list" class="space-y-4 max-w-4xl mx-auto">
                    <!-- Orders injected here -->
                </div>
            </section>

        </main>

        <!-- Floating Action Button (FAB) -->
        <button id="fab" class="absolute bottom-24 md:bottom-10 right-5 md:right-10 w-14 h-14 bg-brand-red hover:bg-red-700 text-white rounded-full shadow-lg shadow-red-500/30 hover:shadow-xl transform hover:scale-105 active:scale-90 transition-all flex items-center justify-center z-30">
            <i class="ph ph-plus text-2xl font-bold"></i>
        </button>

        <!-- Mobile Bottom Nav -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 h-[calc(4rem+env(safe-area-inset-bottom))] pb-safe z-40 grid grid-cols-3">
            <button data-target="products-section" class="nav-btn-mobile flex flex-col items-center justify-center gap-1 text-slate-400 active-mobile-nav">
                <i class="ph ph-camera text-2xl"></i>
                <span class="text-[10px] font-bold">Products</span>
            </button>
            <button data-target="categories-section" class="nav-btn-mobile flex flex-col items-center justify-center gap-1 text-slate-400">
                <i class="ph ph-squares-four text-2xl"></i>
                <span class="text-[10px] font-bold">Categories</span>
            </button>
            <button data-target="orders-section" class="nav-btn-mobile flex flex-col items-center justify-center gap-1 text-slate-400">
                <i class="ph ph-receipt text-2xl"></i>
                <span class="text-[10px] font-bold">Orders</span>
            </button>
        </nav>
    </div>

    <!-- ===== CAMERA OVERLAY (FULL SCREEN) ===== -->
    <div id="camera-overlay" class="fixed inset-0 z-[80] bg-black hidden flex flex-col">
        <!-- Top Controls -->
        <div class="absolute top-0 left-0 right-0 p-4 pt-safe z-20 flex justify-between items-center bg-gradient-to-b from-black/50 to-transparent">
            <button id="camera-close" class="text-white p-2 rounded-full bg-white/20 backdrop-blur-md">
                <i class="ph ph-x text-xl"></i>
            </button>
            <div class="flex gap-4">
                <button id="camera-flash" class="text-white p-2 rounded-full bg-white/20 backdrop-blur-md hidden">
                    <i class="ph ph-lightning text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Video Feed -->
        <div class="flex-1 relative flex items-center justify-center bg-black overflow-hidden">
            <video id="main-camera-feed" class="w-full h-full object-cover" autoplay playsinline muted></video>
            
            <!-- Zoom Slider (Shown if supported) -->
            <div id="zoom-container" class="absolute bottom-8 left-10 right-10 hidden z-20">
                <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" class="w-full">
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="h-32 bg-black flex items-center justify-center gap-12 pb-safe relative z-20">
            <button id="camera-capture-btn" class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center relative after:content-[''] after:w-14 after:h-14 after:bg-white after:rounded-full after:active:scale-90 after:transition-transform"></button>
        </div>
        <canvas id="camera-temp-canvas" class="hidden"></canvas>
    </div>

    <!-- ===== IMAGE EDITOR OVERLAY ===== -->
    <div id="image-editor" class="fixed inset-0 z-[90] bg-slate-900 hidden flex flex-col">
        <!-- Editor Header -->
        <div class="h-14 bg-slate-900 flex items-center justify-between px-4 pt-safe border-b border-slate-800">
            <button id="editor-cancel" class="text-white font-medium text-sm">Cancel</button>
            <span class="text-white font-bold">Edit Photo</span>
            <button id="editor-save" class="text-brand-red font-bold text-sm">Done</button>
        </div>

        <!-- Editor Canvas Area -->
        <div class="flex-1 flex items-center justify-center bg-slate-950 overflow-hidden relative p-4">
            <canvas id="editor-canvas" class="max-w-full max-h-full object-contain shadow-2xl"></canvas>
        </div>

        <!-- Editor Controls -->
        <div class="bg-slate-900 pb-safe pt-2 px-6 border-t border-slate-800">
            <!-- Filter Sliders -->
            <div class="space-y-4 mb-4">
                <div class="flex items-center gap-3">
                    <i class="ph ph-sun text-slate-400"></i>
                    <input type="range" id="edit-brightness" min="0" max="200" value="100" class="flex-1">
                </div>
                <div class="flex items-center gap-3">
                    <i class="ph ph-contrast text-slate-400"></i>
                    <input type="range" id="edit-contrast" min="0" max="200" value="100" class="flex-1">
                </div>
            </div>

            <!-- Toolbar -->
            <div class="flex justify-between items-center py-2">
                <button id="tool-crop" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center">
                        <i class="ph ph-crop text-xl"></i>
                    </div>
                    <span class="text-[10px]">Crop Sq</span>
                </button>
                
                <button id="tool-blue-bg" class="flex flex-col items-center gap-1 text-slate-400 hover:text-brand-red transition-colors group">
                    <div class="w-10 h-10 rounded-full bg-blue-600 border-2 border-slate-800 group-hover:border-white flex items-center justify-center">
                        <i class="ph ph-user text-white text-xl"></i>
                    </div>
                    <span class="text-[10px]">Blue BG</span>
                </button>

                <button id="tool-reset" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition-colors">
                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center">
                        <i class="ph ph-arrow-counter-clockwise text-xl"></i>
                    </div>
                    <span class="text-[10px]">Reset</span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODALS -->
    
    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm hidden flex items-end md:items-center justify-center p-0 md:p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full md:max-w-2xl h-[92vh] md:h-auto md:max-h-[85vh] rounded-t-3xl md:rounded-3xl shadow-2xl flex flex-col transform translate-y-full md:translate-y-0 transition-transform duration-300">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="product-modal-title" class="font-bold text-lg text-slate-800">Product Details</h3>
                <button class="close-modal w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <form id="product-form" class="space-y-5">
                    <input type="hidden" name="id">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="col-span-1 md:col-span-2">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Product Name</label>
                            <input type="text" name="name" class="w-full mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-dark focus:outline-none font-medium" placeholder="Canon EOS R5" required>
                        </div>
                        
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Price (LKR)</label>
                            <input type="number" name="price" step="0.01" class="w-full mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-dark focus:outline-none font-medium" placeholder="0.00" required>
                        </div>
                        
                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Condition</label>
                            <select name="condition" class="w-full mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-dark focus:outline-none font-medium">
                                <option value="new">Brand New</option>
                                <option value="used">Used / Pre-owned</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Category</label>
                        <div class="relative">
                            <select name="subcategory_id" class="w-full mt-1.5 p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-dark focus:outline-none appearance-none font-medium" required>
                                <!-- Options populated by JS -->
                            </select>
                            <i class="ph ph-caret-down absolute right-4 top-1/2 pt-2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Enhanced Image Picker -->
                    <div class="image-uploader" data-target-input="thumbnail_url">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wide mb-2 block">Product Image</label>
                        
                        <div class="relative w-full h-56 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl mb-4 flex items-center justify-center overflow-hidden group">
                            <img src="" class="preview-img w-full h-full object-contain hidden z-10 bg-white">
                            
                            <div class="placeholder text-slate-400 flex flex-col items-center gap-3">
                                <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center">
                                    <i class="ph ph-image text-2xl"></i>
                                </div>
                                <span class="text-xs font-medium">No image selected</span>
                            </div>
                            
                            <!-- Loading Overlay -->
                            <div class="loading-overlay absolute inset-0 bg-white/80 flex items-center justify-center hidden z-20">
                                <div class="loader border-slate-200 border-t-slate-800"></div>
                            </div>
                        </div>

                        <!-- Hidden Inputs -->
                        <input type="hidden" name="thumbnail_url" class="final-url-input">

                        <!-- Actions Grid -->
                        <div class="grid grid-cols-2 gap-3">
                            <button type="button" class="btn-camera-trigger flex items-center justify-center gap-2 p-3 bg-brand-dark hover:bg-black text-white rounded-xl text-sm font-bold shadow-md active:scale-95 transition-all">
                                <i class="ph ph-camera text-lg"></i> Take Photo
                            </button>
                            
                            <button type="button" class="btn-upload-mode flex items-center justify-center gap-2 p-3 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-sm font-bold shadow-sm relative active:scale-95 transition-all">
                                <i class="ph ph-upload-simple text-lg"></i> Upload
                                <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer file-upload-input z-10">
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-3 bg-slate-50 rounded-b-3xl pb-safe">
                <button type="button" class="close-modal px-6 py-3 text-sm font-bold text-slate-600 hover:bg-slate-200 rounded-xl transition-colors">Cancel</button>
                <button type="button" onclick="document.getElementById('product-form').dispatchEvent(new Event('submit'))" class="px-6 py-3 text-sm font-bold text-white bg-brand-red hover:bg-red-700 rounded-xl shadow-lg shadow-red-200 active:scale-95 transition-all">Save Product</button>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="category-modal" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 id="category-modal-title" class="font-bold text-lg text-slate-800">New Category</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i class="ph ph-x text-xl"></i></button>
            </div>
            <form id="category-form" class="p-6 space-y-4">
                <input type="hidden" name="id"> <!-- ID for editing -->
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Category Name</label>
                    <input type="text" name="name" class="w-full mt-1.5 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-dark outline-none font-medium" required>
                </div>
                
                <!-- Category Image Picker -->
                <div class="image-uploader" data-target-input="image_url">
                    <label class="text-xs font-bold text-slate-500 uppercase mb-2 block">Icon / Image</label>
                    
                    <div class="relative w-full h-32 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl mb-3 flex items-center justify-center overflow-hidden group">

                         <div class="loading-overlay absolute inset-0 bg-white/80 flex items-center justify-center hidden z-20">

                        </div>

                    <input type="hidden" name="image_url" class="final-url-input">

                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" class="btn-camera-trigger flex items-center justify-center gap-2 p-2 bg-slate-800 text-white rounded-xl text-xs font-bold">
                            <i class="ph ph-camera"></i> Camera
                        </button>
                        <button type="button" class="btn-upload-mode flex items-center justify-center gap-2 p-2 bg-white border border-slate-200 rounded-xl text-xs font-bold relative">
                            <i class="ph ph-upload-simple"></i> Upload
                            <input type="file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer file-upload-input z-10">
                        </button>
                    </div>
                </div>

                <button type="submit" id="category-submit-btn" class="w-full py-3.5 bg-brand-red text-white rounded-xl font-bold hover:bg-red-700 shadow-lg shadow-red-200 mt-2 transition-all">Save Category</button>
            </form>

    <!-- Subcategory Modal -->
    <div id="subcategory-modal" class="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl transform scale-95 transition-transform duration-300">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 id="subcategory-modal-title" class="font-bold text-lg">New Subcategory</h3>
                <button class="close-modal text-slate-400 hover:text-slate-600"><i class="ph ph-x text-xl"></i></button>
            </div>
            <form id="subcategory-form" class="p-6 space-y-4">
                <input type="hidden" name="category_id">
                <input type="hidden" name="id"> <!-- For editing -->
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wide">Subcategory Name</label>
                    <input type="text" name="name" class="w-full mt-1.5 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-dark outline-none font-medium" required>
                </div>
                <button type="submit" class="w-full py-3.5 bg-brand-dark text-white rounded-xl font-bold hover:bg-black transition-all">Save</button>

    <!-- Delete Modal -->
    <div id="delete-modal" class="fixed inset-0 z-[70] bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 text-center transform scale-100 transition-all">
            <div class="w-14 h-14 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="ph ph-trash text-3xl"></i>
            </div>
            <h3 class="font-bold text-xl text-slate-800 mb-2">Delete Item?</h3>
            <p class="text-sm text-slate-500 mb-6">This action cannot be undone.</p>
            <div class="flex gap-3">
                <button class="close-modal flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-colors">Cancel</button>
                <button id="confirm-delete-btn" class="flex-1 py-3 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 shadow-lg shadow-red-200 transition-all">Delete</button>

    <!-- Toast -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-max max-w-[90vw]"></div>

    <script>
        class AdminApp {
            constructor() {
                // Initialize Supabase (Use your own keys here if needed)
                const SUPABASE_URL = 'https://ysigixfsunoovyaoasdh.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlzaWdpeGZzdW5vb3Z5YW9hc2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzNjc5NzIsImV4cCI6MjA4NTk0Mzk3Mn0.U5_aWaUTIlqwyKTlJcSMl-YHjD5KDbA_kUnoEaB3A4Y';
                this.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                // State
                this.products = [];
                this.categories = [];
                this.orders = [];
                this.currentSection = 'products-section';
                this.activeUploader = null; 
                this.stream = null;
                
                // Editor State
                this.editorImage = null; 
                this.editorCanvas = document.getElementById('editor-canvas');
                this.editorCtx = this.editorCanvas.getContext('2d');
                this.editorSettings = { brightness: 100, contrast: 100, blueBg: false, crop: false };

                this.init();
            }

            async init() {
                this.setupListeners();
                
                // Check Session
                if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                    this.showDashboard();
                    await this.fetchData();
                } else {
                    document.getElementById('login-view').classList.remove('hidden');
                }
            }

            setupListeners() {
                // Auth
                document.getElementById('login-form').addEventListener('submit', (e) => this.handleLogin(e));
                
                const logout = () => {
                    sessionStorage.removeItem('isAdminLoggedIn');
                    window.location.reload();
                };
                document.getElementById('logout-btn-desktop').addEventListener('click', logout);
                document.getElementById('logout-btn-mobile').addEventListener('click', logout);

                // Nav
                const navHandler = (target) => {
                    this.currentSection = target;
                    this.updateUI();
                };
                document.querySelectorAll('.nav-btn, .nav-btn-mobile').forEach(btn => {
                    btn.addEventListener('click', () => navHandler(btn.dataset.target));
                });

                // FAB
                document.getElementById('fab').addEventListener('click', () => {
                    if (this.currentSection === 'products-section') this.openModal('product-modal');
                    if (this.currentSection === 'categories-section') this.openModal('category-modal');
                });

                // Modal Close
                document.querySelectorAll('.close-modal').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const modal = e.target.closest('[id$="-modal"]');
                        this.closeModal(modal.id);
                    });
                });

                // Forms
                document.getElementById('product-form').addEventListener('submit', (e) => this.saveProduct(e));
                document.getElementById('category-form').addEventListener('submit', (e) => this.saveCategory(e));
                document.getElementById('subcategory-form').addEventListener('submit', (e) => this.saveSubcategory(e));

                // === CAMERA & UPLOAD LISTENERS ===
                document.querySelectorAll('.btn-camera-trigger').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.activeUploader = e.target.closest('.image-uploader');
                        this.openCamera();
                    });
                });

                document.querySelectorAll('.file-upload-input').forEach(input => {
                    input.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            this.activeUploader = e.target.closest('.image-uploader');
                            await this.loadImageIntoEditor(file);
                        }
                    });
                });

                document.getElementById('camera-close').addEventListener('click', () => this.closeCamera());
                document.getElementById('camera-capture-btn').addEventListener('click', () => this.capturePhoto());
                
                document.getElementById('camera-flash').addEventListener('click', () => this.toggleFlash());
                document.getElementById('zoom-slider').addEventListener('input', (e) => this.setZoom(e.target.value));

                document.getElementById('editor-cancel').addEventListener('click', () => this.closeEditor());
                document.getElementById('editor-save').addEventListener('click', () => this.saveEditedImage());
                
                document.getElementById('edit-brightness').addEventListener('input', () => this.renderEditor());
                document.getElementById('edit-contrast').addEventListener('input', () => this.renderEditor());
                
                document.getElementById('tool-crop').addEventListener('click', () => {
                    this.editorSettings.crop = !this.editorSettings.crop;
                    this.renderEditor();
                });
                document.getElementById('tool-blue-bg').addEventListener('click', () => {
                    this.editorSettings.blueBg = !this.editorSettings.blueBg;
                    this.renderEditor();
                });
                document.getElementById('tool-reset').addEventListener('click', () => {
                    this.editorSettings = { brightness: 100, contrast: 100, blueBg: false, crop: false };
                    document.getElementById('edit-brightness').value = 100;
                    document.getElementById('edit-contrast').value = 100;
                    this.renderEditor();
                });
            }

            // --- CATEGORY & SUB LOGIC ---
            renderCategories() {
                const container = document.getElementById('categories-list');
                container.innerHTML = this.categories.map(c => `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <!-- Header (Clickable) -->
                        <div class="p-5 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition-colors" onclick="app.toggleCategory(${c.id})">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center overflow-hidden border border-slate-200">
                                    ${c.image_url ? `<img src="${c.image_url}" class="w-full h-full object-cover">` : '<i class="ph ph-tag text-xl text-slate-400"></i>'}
                                </div>
                                <div>
                                    <h3 class="font-bold text-slate-800">${c.name}</h3>
                                    <p class="text-xs text-slate-500">${c.subcategories?.length || 0} Subcategories</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="event.stopPropagation(); app.editCategory(${c.id})" class="p-2 text-slate-400 hover:text-brand-dark rounded-full hover:bg-white transition-all">
                                    <i class="ph ph-pencil-simple text-lg"></i>
                                </button>
                                <i id="icon-${c.id}" class="ph ph-caret-down text-slate-400 text-lg rotate-icon"></i>
                            </div>
                        </div>

                        <!-- Expanded Content -->
                        <div id="cat-content-${c.id}" class="accordion-content bg-slate-50 border-t border-slate-100">
                            <div class="p-4 space-y-2">
                                <div class="flex justify-between items-center mb-2 px-1">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wide">Subcategories</span>
                                    <button onclick="app.openSubcategoryModal(${c.id})" class="text-xs font-bold text-brand-red hover:text-red-700 flex items-center gap-1">
                                        <i class="ph ph-plus"></i> Add New
                                    </button>
                                </div>
                                
                                ${c.subcategories && c.subcategories.length > 0 ? c.subcategories.map(s => `
                                    <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-200">
                                        <span class="text-sm font-medium text-slate-700">${s.name}</span>
                                        <div class="flex items-center gap-1">
                                            <button onclick="app.editSubcategory(${s.id}, '${s.name}', ${c.id})" class="p-1.5 text-slate-400 hover:text-blue-600 rounded-lg hover:bg-blue-50 transition-colors">
                                                <i class="ph ph-pencil-simple"></i>
                                            </button>
                                            <button onclick="app.confirmDelete('subcategory', ${s.id})" class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition-colors">
                                                <i class="ph ph-trash"></i>
                                            </button>
                                        </div>
                                    </div>
                                `).join('') : `
                                    <div class="text-center py-4 text-slate-400 text-sm italic">No subcategories yet</div>
                                `}
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            toggleCategory(id) {
                const content = document.getElementById(`cat-content-${id}`);
                const icon = document.getElementById(`icon-${id}`);
                
                const isOpen = content.classList.contains('open');
                
                // Close all others (optional accordion behavior)
                document.querySelectorAll('.accordion-content').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.rotate-icon').forEach(el => el.classList.remove('open'));

                if (!isOpen) {
                    content.classList.add('open');
                    icon.classList.add('open');
                }
            }

            editCategory(id) {
                const c = this.categories.find(x => x.id === id);
                if(!c) return;

                const form = document.getElementById('category-form');
                form.id.value = c.id;
                form.name.value = c.name;
                
                // Image handling
                const container = form.querySelector('.image-uploader');
                const inp = container.querySelector('.final-url-input');
                const prev = container.querySelector('.preview-img');
                const place = container.querySelector('.placeholder');

                inp.value = c.image_url || '';
                if(c.image_url) {
                    prev.src = c.image_url;
                    prev.classList.remove('hidden');
                    place.classList.add('hidden');
                } else {
                    prev.classList.add('hidden');
                    place.classList.remove('hidden');
                }

                document.getElementById('category-modal-title').textContent = 'Edit Category';
                document.getElementById('category-submit-btn').textContent = 'Update Category';
                this.openModal('category-modal');
            }

            async saveCategory(e) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                const id = formData.get('id');

                const data = {
                    name: formData.get('name'),
                    image_url: formData.get('image_url')
                };

                let res;
                if(id) {
                    res = await this.supabase.from('categories').update(data).eq('id', id);
                } else {
                    res = await this.supabase.from('categories').insert(data);
                }

                if (res.error) this.showToast(res.error.message, 'error');
                else {
                    this.showToast(id ? 'Category Updated' : 'Category Created', 'success');
                    this.closeModal('category-modal');
                    this.fetchData();
                    // Reset
                    form.reset();
                    form.id.value = '';
                    const container = form.querySelector('.image-uploader');
                    container.querySelector('.preview-img').classList.add('hidden');
                    container.querySelector('.placeholder').classList.remove('hidden');
                }
            }

            openSubcategoryModal(catId) {
                const form = document.getElementById('subcategory-form');
                form.reset();
                form.category_id.value = catId;
                form.id.value = ''; // Ensure clear ID for new adds
                document.getElementById('subcategory-modal-title').textContent = 'New Subcategory';
                this.openModal('subcategory-modal');
            }

            editSubcategory(id, name, catId) {
                const form = document.getElementById('subcategory-form');
                form.id.value = id;
                form.name.value = name;
                form.category_id.value = catId;
                document.getElementById('subcategory-modal-title').textContent = 'Edit Subcategory';
                this.openModal('subcategory-modal');
            }

            async saveSubcategory(e) {
                e.preventDefault();
                const form = e.target;
                const id = form.id.value;
                const data = {
                    name: form.name.value,
                    category_id: form.category_id.value
                };

                let res;
                if(id) {
                    res = await this.supabase.from('subcategories').update(data).eq('id', id);
                } else {
                    res = await this.supabase.from('subcategories').insert(data);
                }

                if (res.error) this.showToast(res.error.message, 'error');
                else {
                    this.showToast(id ? 'Subcategory Updated' : 'Subcategory Added', 'success');
                    this.closeModal('subcategory-modal');
                    this.fetchData();
                    form.reset();
                }
            }
            
            // --- DELETION LOGIC ---
            confirmDelete(type, id) {
                this.openModal('delete-modal');
                const btn = document.getElementById('confirm-delete-btn');
                btn.onclick = async () => {
                    let table = 'products';
                    if (type === 'category') table = 'categories';
                    if (type === 'subcategory') table = 'subcategories';
                    
                    const { error } = await this.supabase.from(table).delete().eq('id', id);
                    if (error) this.showToast('Error deleting item', 'error');
                    else {
                        this.showToast('Item deleted', 'success');
                        this.fetchData();
                    }
                    this.closeModal('delete-modal');
                };
            }

            // --- CAMERA & EDITOR (Existing Logic) ---
            async openCamera() {
                const overlay = document.getElementById('camera-overlay');
                const video = document.getElementById('main-camera-feed');
                overlay.classList.remove('hidden');
                try {
                    const constraints = { video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } };
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = this.stream;
                    const track = this.stream.getVideoTracks()[0];
                    const capabilities = track.getCapabilities();
                    const flashBtn = document.getElementById('camera-flash');
                    if (capabilities.torch) flashBtn.classList.remove('hidden'); else flashBtn.classList.add('hidden');
                    const zoomContainer = document.getElementById('zoom-container');
                    const zoomSlider = document.getElementById('zoom-slider');
                    if (capabilities.zoom) {
                        zoomContainer.classList.remove('hidden');
                        zoomSlider.min = capabilities.zoom.min;
                        zoomSlider.max = capabilities.zoom.max;
                        zoomSlider.step = capabilities.zoom.step;
                    } else zoomContainer.classList.add('hidden');
                } catch (err) {
                    console.error("Camera Error", err);
                    this.showToast('Camera access denied', 'error');
                    this.closeCamera();
                }
            }

            closeCamera() {
                const overlay = document.getElementById('camera-overlay');
                overlay.classList.add('hidden');
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }
            }

            async toggleFlash() {
                if (!this.stream) return;
                const track = this.stream.getVideoTracks()[0];
                const settings = track.getSettings();
                const isTorchOn = settings.torch || false;
                try {
                    await track.applyConstraints({ advanced: [{ torch: !isTorchOn }] });
                    const btn = document.getElementById('camera-flash');
                    btn.classList.toggle('text-yellow-400', !isTorchOn);
                    btn.classList.toggle('text-white', isTorchOn);
                } catch (e) { console.error('Flash toggle failed', e); }
            }

            async setZoom(val) {
                if (!this.stream) return;
                const track = this.stream.getVideoTracks()[0];
                try { await track.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] }); } catch (e) { console.error(e); }
            }

            capturePhoto() {
                const video = document.getElementById('main-camera-feed');
                const canvas = document.getElementById('camera-temp-canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                canvas.toBlob((blob) => {
                    this.closeCamera();
                    this.loadImageIntoEditor(blob);
                }, 'image/jpeg', 0.95);
            }

            async loadImageIntoEditor(blobOrFile) {
                const editor = document.getElementById('image-editor');
                editor.classList.remove('hidden');
                this.editorImage = await createImageBitmap(blobOrFile);
                this.editorSettings = { brightness: 100, contrast: 100, blueBg: false, crop: false };
                document.getElementById('edit-brightness').value = 100;
                document.getElementById('edit-contrast').value = 100;
                this.renderEditor();
            }

            renderEditor() {
                if (!this.editorImage) return;
                const cvs = this.editorCanvas;
                const ctx = this.editorCtx;
                const { width, height } = this.editorImage;
                let drawWidth = width;
                let drawHeight = height;
                let sx = 0, sy = 0;
                if (this.editorSettings.crop) {
                    const size = Math.min(width, height);
                    sx = (width - size) / 2;
                    sy = (height - size) / 2;
                    drawWidth = size;
                    drawHeight = size;
                }
                cvs.width = drawWidth;
                cvs.height = drawHeight;
                ctx.clearRect(0, 0, cvs.width, cvs.height);
                if (this.editorSettings.blueBg) {
                    ctx.fillStyle = '#0066cc';
                    ctx.fillRect(0, 0, cvs.width, cvs.height);
                    const scale = 0.85;
                    const w = cvs.width * scale;
                    const h = cvs.height * scale;
                    const x = (cvs.width - w) / 2;
                    const y = (cvs.height - h) / 2;
                    ctx.filter = `brightness(${this.editorSettings.brightness}%) contrast(${this.editorSettings.contrast}%)`;
                    ctx.drawImage(this.editorImage, sx, sy, drawWidth, drawHeight, x, y, w, h);
                } else {
                    ctx.filter = `brightness(${this.editorSettings.brightness}%) contrast(${this.editorSettings.contrast}%)`;
                    ctx.drawImage(this.editorImage, sx, sy, drawWidth, drawHeight, 0, 0, cvs.width, cvs.height);
                }
                ctx.filter = 'none';
            }

            closeEditor() {
                document.getElementById('image-editor').classList.add('hidden');
                this.editorImage = null;
            }

            async saveEditedImage() {
                const cvs = this.editorCanvas;
                const btn = document.getElementById('editor-save');
                btn.textContent = 'Uploading...';
                cvs.toBlob(async (blob) => {
                    const file = new File([blob], `edit_${Date.now()}.jpg`, { type: 'image/jpeg' });
                    if (this.activeUploader) {
                        const loader = this.activeUploader.querySelector('.loading-overlay');
                        const hiddenInput = this.activeUploader.querySelector('.final-url-input');
                        const previewImg = this.activeUploader.querySelector('.preview-img');
                        const placeholder = this.activeUploader.querySelector('.placeholder');
                        this.closeEditor();
                        if(loader) loader.classList.remove('hidden');
                        try {
                            const fileName = `${Date.now()}_edited.jpg`;
                            const { data, error } = await this.supabase.storage.from('images').upload(fileName, file);
                            if (error) throw error;
                            const { data: { publicUrl } } = this.supabase.storage.from('images').getPublicUrl(fileName);
                            hiddenInput.value = publicUrl;
                            previewImg.src = publicUrl;
                            previewImg.classList.remove('hidden');
                            if(placeholder) placeholder.classList.add('hidden');
                            this.showToast('Image Saved', 'success');
                        } catch (err) {
                            console.error(err);
                            this.showToast('Upload Failed', 'error');
                        } finally {
                             if(loader) loader.classList.add('hidden');
                             btn.textContent = 'Done';
                        }
                    }
                }, 'image/jpeg', 0.9);
            }

            // --- STANDARD APP LOGIC ---
            async handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const { data, error } = await this.supabase.from('admins').select('password').eq('email', email).single();
                if (!error && data && data.password === password) {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    this.showDashboard();
                    this.fetchData();
                } else {
                    this.showToast('Invalid credentials', 'error');
                }
            }

            showDashboard() {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            }

            async fetchData() {
                try {
                    const [productsRes, categoriesRes, ordersRes] = await Promise.all([
                        this.supabase.from('products_with_details').select('*').order('created_at', { ascending: false }),
                        this.supabase.from('categories').select('*, subcategories(*)').order('name'),
                        this.supabase.from('orders').select('*, order_items(*)').order('created_at', { ascending: false })
                    ]);
                    if (productsRes.error) throw productsRes.error;
                    this.products = productsRes.data;
                    this.categories = categoriesRes.data;
                    this.orders = ordersRes.data;
                    this.renderAll();
                    this.showToast('Inventory Synced', 'success');
                } catch (err) {
                    console.error(err);
                    this.showToast('Sync Failed', 'error');
                }
            }

            renderAll() {
                this.renderProducts();
                this.renderCategories();
                this.renderOrders();
                this.populateSubcategorySelect();
            }

            renderProducts() {
                const container = document.getElementById('product-list');
                if (this.products.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">No products found.</div>`;
                    return;
                }
                container.innerHTML = this.products.map(p => `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 relative group hover:border-brand-red/20 transition-all">
                        <div class="flex gap-4">
                            <div class="w-20 h-20 rounded-xl bg-slate-50 flex-shrink-0 overflow-hidden border border-slate-100">
                                <img src="${p.thumbnail_url || 'https://placehold.co/100x100?text=No+Img'}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-slate-800 truncate">${p.name}</h3>
                                <p class="text-xs text-slate-500 mb-1">${p.category_name || ''}</p>
                                <div class="flex items-center justify-between">
                                    <span class="text-sm font-bold text-slate-900">LKR ${parseFloat(p.price).toLocaleString()}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full ${p.condition === 'new' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'} font-bold uppercase">${p.condition}</span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-50 flex justify-end gap-2">
                             <button onclick="app.editProduct(${p.id})" class="text-xs font-bold text-slate-500 hover:text-brand-red px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">EDIT</button>
                             <button onclick="app.confirmDelete('product', ${p.id})" class="text-xs font-bold text-red-500 hover:text-red-700 px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">DELETE</button>
                        </div>
                    </div>
                `).join('');
            }

            renderOrders() {
                const container = document.getElementById('order-list');
                container.innerHTML = this.orders.map(o => `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="font-bold text-slate-800">${o.customer_name}</h4>
                                <p class="text-xs text-slate-500">${new Date(o.created_at).toLocaleDateString()}</p>
                            </div>
                            <span class="px-2 py-1 bg-slate-100 rounded-lg text-xs font-bold text-slate-600 uppercase">${o.status || 'Pending'}</span>
                        </div>
                        <div class="flex justify-between items-end mt-4">
                            <a href="tel:${o.customer_phone}" class="flex items-center gap-2 text-sm text-slate-600 font-medium hover:text-brand-red">
                                <i class="ph ph-phone-call text-lg"></i> Call
                            </a>
                            <p class="text-lg font-bold text-brand-dark">LKR ${parseFloat(o.total_price).toLocaleString()}</p>
                        </div>
                    </div>
                `).join('');
            }

            populateSubcategorySelect() {
                const select = document.querySelector('[name="subcategory_id"]');
                select.innerHTML = '<option value="" disabled selected>Select Category</option>' + this.categories.map(c => `
                    <optgroup label="${c.name}">
                        ${c.subcategories.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                    </optgroup>
                `).join('');
            }

            updateUI() {
                document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                document.getElementById(this.currentSection).classList.remove('hidden');
                
                const titles = {'products-section': 'Inventory', 'categories-section': 'Categories', 'orders-section': 'Sales Orders'};
                document.getElementById('page-title').textContent = titles[this.currentSection];

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const active = btn.dataset.target === this.currentSection;
                    btn.className = `nav-btn w-full flex items-center gap-3 px-5 py-3.5 text-sm font-semibold rounded-2xl transition-all ${active ? 'bg-slate-50 text-brand-red' : 'text-slate-600 hover:bg-slate-50 hover:text-brand-red'}`;
                });

                document.querySelectorAll('.nav-btn-mobile').forEach(btn => {
                    const active = btn.dataset.target === this.currentSection;
                    btn.classList.toggle('text-brand-red', active);
                    btn.classList.toggle('text-slate-400', !active);
                });

                const fab = document.getElementById('fab');
                if(this.currentSection === 'orders-section') fab.classList.add('scale-0');
                else fab.classList.remove('scale-0');
            }

            // --- PRODUCT ACTIONS ---
            editProduct(id) {
                const p = this.products.find(x => x.id === id);
                if (!p) return;
                const form = document.getElementById('product-form');
                form.id.value = p.id;
                form.name.value = p.name;
                form.price.value = p.price;
                form.condition.value = p.condition;
                form.subcategory_id.value = p.subcategory_id;
                const container = form.querySelector('.image-uploader');
                const prev = container.querySelector('.preview-img');
                const place = container.querySelector('.placeholder');
                const inp = container.querySelector('.final-url-input');
                inp.value = p.thumbnail_url || '';
                if(p.thumbnail_url) {
                    prev.src = p.thumbnail_url;
                    prev.classList.remove('hidden');
                    place.classList.add('hidden');
                } else {
                    prev.classList.add('hidden');
                    place.classList.remove('hidden');
                }
                document.getElementById('product-modal-title').textContent = 'Edit Product';
                this.openModal('product-modal');
            }

            async saveProduct(e) {
                e.preventDefault();
                const form = e.target;
                const formData = new FormData(form);
                const id = formData.get('id');
                const data = {
                    name: formData.get('name'),
                    price: parseFloat(formData.get('price')),
                    condition: formData.get('condition'),
                    subcategory_id: parseInt(formData.get('subcategory_id'))
                };
                let res;
                if (id) res = await this.supabase.from('products').update(data).eq('id', id);
                else res = await this.supabase.from('products').insert(data).select().single();

                if (res.error) this.showToast(res.error.message, 'error');
                else {
                    const newId = id || res.data.id;
                    const imgUrl = formData.get('thumbnail_url');
                    if (imgUrl) {
                        await this.supabase.from('product_images').delete().match({ product_id: newId, is_thumbnail: true });
                        await this.supabase.from('product_images').insert({ product_id: newId, image_url: imgUrl, is_thumbnail: true });
                    }
                    this.showToast('Product Saved', 'success');
                    this.closeModal('product-modal');
                    this.fetchData();
                    form.reset();
                    form.id.value = '';
                    const container = form.querySelector('.image-uploader');
                    container.querySelector('.preview-img').classList.add('hidden');
                    container.querySelector('.placeholder').classList.remove('hidden');
                    container.querySelector('.final-url-input').value = '';
                }
            }

            openModal(id) {
                const modal = document.getElementById(id);
                modal.classList.remove('hidden');
                void modal.offsetWidth;
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('translate-y-full', 'scale-95');
                if (id === 'product-modal' && !document.querySelector('#product-form [name="id"]').value) {
                    document.getElementById('product-modal-title').textContent = 'Add Product';
                }
                if (id === 'category-modal' && !document.querySelector('#category-form [name="id"]').value) {
                    document.getElementById('category-modal-title').textContent = 'New Category';
                    document.getElementById('category-submit-btn').textContent = 'Create Category';
                    // clear image
                    const form = document.getElementById('category-form');
                    const container = form.querySelector('.image-uploader');
                    container.querySelector('.preview-img').classList.add('hidden');
                    container.querySelector('.placeholder').classList.remove('hidden');
                    container.querySelector('.final-url-input').value = '';
                }
            }

            closeModal(id) {
                const modal = document.getElementById(id);
                modal.classList.add('opacity-0');
                modal.querySelector('div').classList.add('translate-y-full', 'scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }

            showToast(msg, type = 'neutral') {
                const container = document.getElementById('toast-container');
                const el = document.createElement('div');
                const colors = type === 'success' ? 'bg-slate-900 text-white' : type === 'error' ? 'bg-red-600 text-white' : 'bg-white text-slate-900 border border-slate-200';
                el.className = `${colors} px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3 font-bold transform -translate-y-10 opacity-0 transition-all duration-300`;
                el.innerHTML = `<i class="ph ph-${type === 'success' ? 'check-circle' : 'warning-circle'} text-xl"></i> ${msg}`;
                container.appendChild(el);
                requestAnimationFrame(() => el.classList.remove('-translate-y-10', 'opacity-0'));
                setTimeout(() => { el.classList.add('-translate-y-10', 'opacity-0'); setTimeout(() => el.remove(), 300); }, 3000);
            }
        }

        const app = new AdminApp();
    </script>
</body>
</html>
